services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: mpanel, POSTGRES_PASSWORD: mpanel, POSTGRES_DB: mpanel }
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  backend:
    build: { context: ., dockerfile: Dockerfile.backend }
    env_file: backend/.env.example
    environment: { DATABASE_URL: postgresql://mpanel:mpanel@postgres:5432/mpanel?schema=public }
    ports: ["4000:4000"]
    depends_on: [postgres]
  frontend:
    build: { context: ., dockerfile: Dockerfile.frontend }
    env_file: frontend/.env.example
    ports: ["5173:80"]
    depends_on: [backend]
volumes: { postgres_data: {} }
